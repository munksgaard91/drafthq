name: Update FPL data

on:
  schedule:
    - cron: '0 6 * * *'   # dagligt kl. 06:00 UTC
  workflow_dispatch: {}    # tillader manuelt "Run workflow" i GitHub-UI

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch latest FPL data
        run: curl -sf "https://fantasy.premierleague.com/api/bootstrap-static/" -o bootstrap.json

      - name: Build data.json
        run: python3 scripts/build_data_json.py

      - name: Commit if changed
        run: |
          git config user.name "fpl-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Auto-update FPL data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
